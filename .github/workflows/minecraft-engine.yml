name: Universe Minecraft engine APK
on:
  workflow_dispatch:
  push:
    branches:
      - feat/minecraft-engine-zalith-integration
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Universe integration
        uses: actions/checkout@v4
      - name: Checkout Minecraft Java engine source
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: 9546e84b5174cef6d7062322fb33ed442bac3b90
          path: engine/ZalithLauncher2
          fetch-depth: 1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and configure preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;35.0.0" "ndk;25.2.9519653"
      - name: Configure Universe branding
        working-directory: engine/ZalithLauncher2
        env:
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          cat >> ZalithLauncher/gradle.properties <<EOF
          launcher_name=UniverseLauncher
          launcher_app_name=Universe Launcher — Unofficial Modified Version
          launcher_short_name=UNV
          url_home=https://github.com/tarachukalucas-cyber/Universe-laucher
          launcher_version_code=200049
          launcher_version_name=0.3.0-alpha
          oauth_client_id=${MICROSOFT_OAUTH_CLIENT_ID}
          EOF
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Minecraft Java launcher
        working-directory: engine/ZalithLauncher2
        run: gradle :ZalithLauncher:assembleDebug -Parch=arm64
      - name: Upload Universe APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLauncher-MinecraftJava-arm64-debug
          path: engine/ZalithLauncher2/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
